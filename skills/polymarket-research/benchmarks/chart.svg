  <title id="title">Benchmark evidence: polymarket-research</title>
  <desc id="desc">Measures whether the model follows the committed Polymarket Research procedure on three frozen offline dossiers: a current conflicted market, a historical-cutoff request, and an unresolved market identity. It does not measure live web or API research, source freshness, probability calibration, forecast accuracy, trading performance, profitability, or paid-provider execution. Raw paired observations for harness process time and tokens, and exact all-checks-passed counts. Descriptive evidence only.</desc>
